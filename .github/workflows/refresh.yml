name: Refresh Dashboard Metrics

on:
  schedule:
    # Runs every day at 9:30 AM IST (04:00 UTC)
    - cron: '0 4 * * *'
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install certifi

      # ── India ───────────────────────────────────────────
      - name: Refresh India (YouTube + Instagram via Apify)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python refresh_metrics.py

      # ── Australia + UAE ─────────────────────────────────
      - name: Refresh AU + UAE (Instagram via Apify)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SKIP_PUSH: "1"
        run: python refresh_au_uae.py

      # ── Commit all updated data files ───────────────────
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_data.json daily_snapshots.json \
                  au_live_data.json uae_live_data.json delta_log.json
          git diff --cached --quiet || \
            git commit -m "chore: auto-refresh metrics $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git pull --rebase origin main
          git push

      # ── Comprehensive Slack report (all markets) ────────
      - name: Send Slack report
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python notify_slack.py

      # Cloudflare Pages auto-deploys on every push — no deploy step needed
