name: Refresh Dashboard Metrics

on:
  schedule:
    # Runs every Tuesday at 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * 2'
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit live_data.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh metrics from Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python refresh_metrics.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_data.json
          git diff --cached --quiet || git commit -m "chore: refresh metrics $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
